# Ambiente de desenvolvimento local: backend fora do Docker
server.address=127.0.0.1
server.port=9090
spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:pedidos}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:pedidos_local_123}
spring.rabbitmq.virtual-host=/
# Confirmação/roteamento da publicação
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
# Consumo controlado para simulado
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
# Convenções próprias: precisam ser consumidas por @Configuration e @Value
app.rabbitmq.exchange.entrada=pedidos.exchange.luiz-victor
app.rabbitmq.exchange.status=pedidos.status.exchange.luiz-victor
app.rabbitmq.exchange.dlx=pedidos.dlx.luiz-victor
app.rabbitmq.queue.entrada=pedidos.entrada.luiz-victor
app.rabbitmq.queue.sucesso=pedidos.status.sucesso.luiz-victor
app.rabbitmq.queue.falha=pedidos.status.falha.luiz-victor
app.rabbitmq.queue.dlq=pedidos.entrada.luiz-victor.dlq
app.rabbitmq.routing.entrada=pedidos.entrada
app.rabbitmq.routing.sucesso=pedidos.status.sucesso
app.rabbitmq.routing.falha=pedidos.status.falha
app.rabbitmq.routing.dlq=pedidos.entrada.dlq
app.publisher.confirm-timeout-seconds=5
# Log local
logging.level.br.com.pedidos=INFO
